spring.application.name=javacourse-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080
spring.mvc.async.request-timeout=300000

spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3307/javacourse_kb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:javacourse}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

ai.service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:9000}
minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET_NAME:knowledge-base}
