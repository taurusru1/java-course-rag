# 开发环境依赖：MySQL 8.0
# 用法：docker compose -f docker-compose.dev.yml up -d
# 说明：首次启动会自动执行 db/schema.sql 建库建表；数据持久化在 mysql-data 卷。
services:
  mysql:
    image: mysql:8.0
    container_name: javacourse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: javacourse
      MYSQL_DATABASE: javacourse_kb
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pjavacourse"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
